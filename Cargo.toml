[package]
name = "jmap-test"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.81"
confy = "0.6.1"
human-panic = "1.2.3"
jmap-client = { version = "0.3.2", features = ["websockets"] }
secret-service = { version = "3.0.1", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
url = "2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
